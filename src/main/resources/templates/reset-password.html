<!DOCTYPE html>
<html lang="en" xmlrs:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <style>
       
        body {
            font-family: Trebuchet MS;
            background-color: #C1856D;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: #E6CFA9;
            border-radius: 20px;
            padding: 45px;
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            color: #9A3F3F;
        }

        p {
            color: #9A3F11;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 15px;
            background-color: #9A3F3F;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9A3F3F;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password Request</h2>
        <p>We received a request to reset the password for your account <b><span th:text="${name}"></span></b>.</p>
        <p>Please click the link below to reset your password:</p> 
        <a th:href="${resetLink}" class="button">Reset Password</a>
        <p>If you did not request a password reset, please ignore this email.</p>
        <div class="footer">
            <p>&copy; 2025 KNN Bank | Your Pocket Buddy.</p>
        </div>
    </div>
</body>
</html>
