<!DOCTYPE html>
<html lang="en" xmlrs:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      font-family: "Press Start 2P", "Trebuchet MS", sans-serif;
      background-color: #096B68;
      margin: 0;
      padding: 0;
      color: #FFFBDE;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #129990;
      border-radius: 8px;
      padding: 45px;
      border: 3px solid #FFFBDE;
      box-shadow: 6px 6px 0 #90D1CA;
      text-align: center;
    }

    h2 {
      color: #FFFBDE;
      text-shadow: 2px 2px #096B68;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }

    p {
      color: #FFFBDE;
      line-height: 1.8;
      font-size: 0.55rem;
      margin: 10px 0;
    }

    b {
      color: #90D1CA;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      margin: 20px 0;
      background-color: #096B68;
      color: #FFFBDE;
      text-decoration: none;
      border-radius: 4px;
      border: 3px solid #FFFBDE;
      box-shadow: 3px 3px 0 #90D1CA;
      transition: all 0.15s ease;
      font-size: 0.55rem;
    }

    .button:hover {
      background-color: #FFFBDE;
      color: #096B68;
      border-color: #129990;
      box-shadow: 3px 3px 0 #129990;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.45rem;
      color: #FFFBDE;
      text-align: center;
      border-top: 2px solid #90D1CA;
      padding-top: 15px;
    }

    @media only screen and (max-width: 600px) {
      .container {
        padding: 30px;
      }

      h2 {
        font-size: 0.7rem;
      }

      p, .button {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Password Request</h2>
    <p>We received a request to reset the password for your account <b><span th:text="${name}"></span></b>.</p>
    <p>Please click the link below to reset your password:</p> 
    <a th:href="${resetLink}" class="button">Reset Password</a>
    <p>If you did not request a password reset, please ignore this email.</p>
    <div class="footer">
      <p>&copy; 2025 KNN Bank | Your Pocket Buddy</p>
    </div>
  </div>
</body>
</html>
