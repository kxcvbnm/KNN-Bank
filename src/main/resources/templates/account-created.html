<!DOCTYPE html>
<html lang="en" xmlrs:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Account Created!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      font-family: "Press Start 2P", "Trebuchet MS", sans-serif;
      background-color: #096B68;
      margin: 0;
      padding: 0;
      color: #FFFBDE;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #129990;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 6px 6px 0 #90D1CA;
      text-align: center;
      border: 3px solid #FFFBDE;
    }

    h2 {
      color: #FFFBDE;
      text-shadow: 2px 2px #096B68;
      font-size: 0.75rem;
      line-height: 1.6;
    }

    p {
      color: #FFFBDE;
      line-height: 1.8;
      font-size: 0.55rem;
    }

    b {
      color: #90D1CA;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }

    li {
      background: #90D1CA;
      color: #096B68;
      margin: 6px 0;
      padding: 10px;
      border-radius: 4px;
      border: 2px solid #FFFBDE;
      font-size: 0.5rem;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.45rem;
      color: #FFFBDE;
      text-align: center;
      border-top: 2px solid #90D1CA;
      padding-top: 15px;
    }

    @media only screen and (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h2 {
        font-size: 0.65rem;
      }

      p, li {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Thank you, <span th:text="${name}"></span>.</h2>
    <p>Your <b><span th:text="${accountType}"></span></b> account has been created.</p>

    <p><b>Account Details</b></p>
    <ul>
      <li>Account Number: <b><span th:text="${accountNumber}"></span></b></li>
      <li>Account Type: <b><span th:text="${accountType}"></span></b></li>
      <li>Currency: <b><span th:text="${currency}"></span></b></li>
    </ul>

    <p>Thank you for using our services.</p>

    <div class="footer">
      <p>&copy; 2025 KNN Bank | Your Pocket Buddy</p>
    </div>
  </div>
</body>
</html>
