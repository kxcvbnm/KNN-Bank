<!DOCTYPE html>
<html lang="en" xmlrs:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Updated</title>
    <style>
       
        body {
            font-family: Trebuchet MS;
            background-color: #C1856D;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: #E6CFA9;
            border-radius: 20px;
            padding: 45px;
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            color: #9A3F3F;
        }

        p {
            color: #9A3F11;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9A3F3F;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Password Updated Successfully</h2>
        <p><b><span th:text="${name}"></span></b>, your password has been updated.</p>
        <p>If you did not request this change, please contact us immediately.</p>
        <div class="footer">
            <p>&copy; 2025 KNN Bank | Your Pocket Buddy.</p>
        </div>
    </div>
</body>
</html>
