<!DOCTYPE html>
<html lang="en" xmlrs:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Debit Alert</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      font-family: "Press Start 2P", "Trebuchet MS", sans-serif;
      background-color: #096B68;
      margin: 0;
      padding: 0;
      color: #FFFBDE;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #129990;
      border-radius: 8px;
      padding: 45px;
      border: 3px solid #FFFBDE;
      box-shadow: 6px 6px 0 #90D1CA;
      text-align: center;
    }

    h2 {
      color: #FFFBDE;
      text-shadow: 2px 2px #096B68;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }

    .alert {
      background: #90D1CA;
      color: #096B68;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
      border: 3px solid #FFFBDE;
      box-shadow: 3px 3px 0 #096B68;
      font-size: 0.55rem;
    }

    p {
      color: #FFFBDE;
      line-height: 1.8;
      font-size: 0.55rem;
    }

    b {
      color: #FFFBDE;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.45rem;
      color: #FFFBDE;
      text-align: center;
      border-top: 2px solid #90D1CA;
      padding-top: 15px;
    }

    @media only screen and (max-width: 600px) {
      .container {
        padding: 30px;
      }

      h2 {
        font-size: 0.7rem;
      }

      p, .alert {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Debit Alert</h2>
    <p>Dear <span th:text="${name}"></span></p>
    <div class="alert">
      <p>Your account has been debited with <b>฿<span th:text="${amount}"></span></b></p>
      <p>Account Number: <b><span th:text="${accountNumber}"></span></b></p>
      <p>Date: <b><span th:text="${date}"></span></b></p>
      <p>Available Balance: <b>฿<span th:text="${balance}"></span></b></p>
    </div>
    <p>Thank you for using our services.</p>
    <div class="footer">
      <p>&copy; 2025 KNN Bank | Your Pocket Buddy</p>
    </div>
  </div>
</body>
</html>
